[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# SPA fallback — every route serves index.html, except the functions.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
